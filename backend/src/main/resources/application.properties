spring.application.name=backend
server.port=8080
server.forward-headers-strategy=framework
spring.main.allow-bean-definition-overriding=true

# ── Multipart Upload Limits ───────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ── MongoDB ───────────────────────────────────────────────────────────────────
# Primary database (user/auth - backpi)
spring.data.mongodb.uri=mongodb://mongodb:27017/appdb
spring.data.mongodb.auto-index-creation=true

# ── Jackson ───────────────────────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false

# ── External secrets ──────────────────────────────────────────────────────────
spring.config.import=optional:file:secret.properties

# ── Mail (Gmail SMTP) ─────────────────────────────────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=mkadi.8706@gmail.com
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ── Hugging Face (Sentiment Analysis) ────────────────────────────────────────
huggingface.api.url=https://router.huggingface.co/models/cardiffnlp/twitter-roberta-base-sentiment-latest
huggingface.api.token=${HF_TOKEN:}

# ── OpenRouter (AI) ───────────────────────────────────────────────────────────
openrouter.api.key=${OPENROUTER_API_KEY:}
openrouter.api.url=https://openrouter.ai/api/v1/chat/completions
openrouter.model=${OPENROUTER_MODEL:openrouter/free}
openrouter.timeout.seconds=30

# ── Google Gemini AI ──────────────────────────────────────────────────────────
spring.ai.google.gemini.model-id=gemini-3-flash-preview
spring.ai.google.gemini.api-key=${GEMINI_KEY:}

# ── Stripe ────────────────────────────────────────────────────────────────────
stripe.api.key=${STRIPE_API_KEY:}
frontend.url=http://localhost:4200

# ── Kafka ─────────────────────────────────────────────────────────────────────
spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.listener.auto-startup=false

# ── Kafka Topics ──────────────────────────────────────────────────────────────
heartrate.topic.raw=heartrate.raw
heartrate.topic.alerts=heartrate.alerts

# ── Smartwatch ────────────────────────────────────────────────────────────────
heartrate.alert.cooldown-seconds=60
heartrate.smartwatch-token.secret=medisync-smartwatch-dev-secret-change-me
heartrate.smartwatch-token.ttl-seconds=600
heartrate.ai.inference-url=http://localhost:5001/predict
heartrate.ai.backpi-url=http://localhost:8080/api/patients/by-user
heartrate.ai.window-size=60

# ── Help Notification ─────────────────────────────────────────────────────────
helpnotification.mail.host=smtp.gmail.com
helpnotification.mail.port=587
helpnotification.mail.username=mkadi.8706@gmail.com
helpnotification.mail.password=${HELP_MAIL_PASSWORD:}
helpnotification.mail.protocol=smtp
helpnotification.mail.smtp.auth=true
helpnotification.mail.smtp.starttls.enable=true
helpnotification.mail.from=seif@gmail.com
helpnotification.alert.global-cooldown-seconds=60
helpnotification.alert.confirmation-delay-seconds=10

# ── Collab ────────────────────────────────────────────────────────────────────
app.upload.dir=uploads/media
# backpi.base.url is now internal (same process) - kept for any RestTemplate calls
backpi.base.url=http://localhost:8080
collab.service.url=http://localhost:8080

# ── Geo Service ───────────────────────────────────────────────────────────────
infobip.api-key=${INFOBIP_API_KEY:3f21e2010eedf1c52baa593bc52d4e73-1e80e6be-8daa-4100-893e-17c33d3da07b}
infobip.base-url=https://l229yj.api.infobip.com
infobip.from=AlzCare
backpi.url=http://localhost:8080
alzcare.ai.location-url=http://localhost:8000/predict-location
alzcare.ai.hospital-url=http://localhost:8000/predict-hospital

