name: Build and Push Flask API

on:
  push:
    branches:
      - master
    paths:
      - 'flask_api/**'
      - '.github/workflows/docker-flask.yml'

jobs:
  build-and-push-flask:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Flask API image
        uses: docker/build-push-action@v5
        with:
          context: ./flask_api
          file: ./flask_api/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/antigravity-flask:latest
            ${{ secrets.DOCKER_USERNAME }}/antigravity-flask:${{ github.sha }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy Flask to Kubernetes
        run: |
          kubectl apply -f k8s/flask-deployment.yaml
          kubectl apply -f k8s/flask-service.yaml
          kubectl rollout restart deployment/flask-api
